services:
  - type: web
    name: https-incident-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: https-incident-db
          property: connectionString
      - key: OPERATOR_API_KEY
        generateValue: true
      - key: AI_PIPE_TOKEN
        sync: false
      - key: AI_PIPE_MODEL
        value: openai/gpt-4.1-nano
      - key: AI_PIPE_CHAT_URL
        value: https://aipipe.org/openai/v1/chat/completions
      - key: ALLOWED_HTTPS_HOSTS
        value: example.com
      - key: PROBE_TIMEOUT_SECONDS
        value: '5'
databases:
  - name: https-incident-db
    plan: basic-256mb
    databaseName: incidents
    user: incident_agent
